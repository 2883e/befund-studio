<style>
/* Layout: Seitenleiste mit Modulwahl links, Befundbogen als eine Spalte rechts. Handy: Leiste oben, horizontal scrollbar. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface2:#eaeff0; --fg:#18242a; --muted:#5b6b72;
  --line:#d3dcdf; --accent:#0f6b73; --accent-fg:#ffffff; --accent-soft:#d9eeee;
  --warn:#b4531a; --warn-soft:#fbe9dd; --ok:#2b7a4b; --danger:#b3261e; --danger-soft:#fbe3e1;
  --f-display:'Fraunces',Georgia,serif; --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f181c; --surface:#16232a; --surface2:#1e2f37; --fg:#e4edf0; --muted:#97a9b0;
  --line:#2c4049; --accent:#5ec3c9; --accent-fg:#0b1a1d; --accent-soft:#17383d;
  --warn:#f0a06a; --warn-soft:#3a2415; --ok:#6fd09a; --danger:#ff8a80; --danger-soft:#3b1b19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f181c; --surface:#16232a; --surface2:#1e2f37; --fg:#e4edf0; --muted:#97a9b0;
  --line:#2c4049; --accent:#5ec3c9; --accent-fg:#0b1a1d; --accent-soft:#17383d;
  --warn:#f0a06a; --warn-soft:#3a2415; --ok:#6fd09a; --danger:#ff8a80; --danger-soft:#3b1b19; color-scheme:dark}
[hidden]{display:none!important}
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
h2{font-size:1.45rem}h3{font-size:1.05rem;font-family:var(--f-body);font-weight:600}
.app{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
header.top{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:20px 0 4px}
header.top h1{font-size:1.7rem}
header.top small{display:block;color:var(--muted);font:400 .8rem var(--f-body);margin-top:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
nav.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:18px;min-width:0}
.navgrp h4{margin:0 0 6px;font:600 .72rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.navgrp a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;color:var(--fg);text-decoration:none;font-size:.92rem}
.navgrp a:hover{background:var(--surface2)}
.fixed-tag{font:500 .68rem var(--f-mono);color:var(--muted);margin-left:auto}
.mod{min-width:0;display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;margin-bottom:6px;font-size:.92rem;user-select:none}
.mod input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.mod:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.mod:focus-within{outline:2px solid var(--accent);outline-offset:1px}
main{display:flex;flex-direction:column;gap:22px;min-width:0}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;scroll-margin-top:12px;min-width:0}
section.card>header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
section.card>header .sub{color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.grid.w2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label,.lbl{font:500 .78rem var(--f-body);color:var(--muted);letter-spacing:.02em}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.sub-h{margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sub-h:first-of-type{margin-top:0}
.hint{color:var(--muted);font-size:.83rem;margin:0 0 10px}
.btn{font:500 .88rem var(--f-body);padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:.84rem;cursor:pointer;background:var(--bg);user-select:none}
.chip input{accent-color:var(--accent);margin:0}
.chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.chips.red .chip:has(input:checked){background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.chips.yellow .chip:has(input:checked){background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{font:600 .72rem var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;background:var(--surface2);white-space:nowrap}
td{padding:4px;border-top:1px solid var(--line);vertical-align:middle}
td input,td select{padding:5px 7px;min-width:70px}
td.nm{padding:4px 10px;white-space:nowrap;font-weight:500}
td.ref{font:400 .78rem var(--f-mono);color:var(--muted);white-space:nowrap;padding:4px 8px}
.num{font-variant-numeric:tabular-nums}
.flag{border-left:3px solid var(--danger);background:var(--danger-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:.88rem;margin-bottom:10px}
.banner{background:var(--warn-soft);border:1px solid var(--warn);color:var(--fg);border-radius:8px;padding:10px 14px;font-size:.85rem}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.bodybox{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px;text-align:center}
.bodybox canvas{width:100%;max-width:300px;height:auto;touch-action:none;cursor:crosshair;display:block;margin:0 auto}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.posture-wrap{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px;overflow:auto}
.posture-wrap canvas{display:block;max-width:100%;touch-action:none;margin:0 auto}
.res{font:400 .85rem var(--f-mono);display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 18px;margin-top:12px}
.res div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.res b{font-weight:500}
.res .bad{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:50}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal>div{background:var(--surface);border-radius:10px;max-width:760px;width:100%;max-height:88vh;display:flex;flex-direction:column;gap:12px;padding:20px}
.modal textarea{flex:1;min-height:320px;font:400 .82rem/1.45 var(--f-mono)}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.lrow .hint{margin:0}
.modal>div{overflow:auto}
.pv,.pv-extra,.print-head,.print-only{display:none}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);gap:16px}
  nav.side{position:static}
  .navgrp.mods{display:block}
  section.card{padding:16px}
}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
@media print{
  :root,:root[data-theme]{--bg:#fff;--surface:#fff;--surface2:#eef2f3;--fg:#000;--muted:#3d4a50;--line:#b9c3c7;--accent:#0f6b73;--accent-soft:#e2f1f1;--warn:#b4531a;--warn-soft:#fbe9dd;--danger:#b3261e;--danger-soft:#fbe3e1;color-scheme:light}
  body{background:#fff;color:#000;padding:0;font-size:10.5pt;line-height:1.4}
  header.top,nav.side,#modal-root,.toast,button,.hint,.banner,input[type=file],#bc-types,#po-views,#po-list,.noprint,#po-res,.tools{display:none!important}
  .app{display:block;max-width:none}
  main{gap:12pt}
  section.card{border:none;border-radius:0;padding:0 0 8pt;break-inside:auto}
  section.card>header{break-after:avoid;margin-bottom:8pt;padding-bottom:4pt;border-bottom:1.5pt solid #000}
  section.card>header h2{font-size:14pt}
  .sub-h{break-after:avoid;margin:10pt 0 5pt}
  .sub-h h3{font-size:11pt;border-bottom:.5pt solid var(--line);padding-bottom:2pt;width:100%}
  .grid,.grid.w2{grid-template-columns:repeat(2,minmax(0,1fr));gap:6pt 14pt}
  .f{break-inside:avoid}
  .f>label,.lbl{font-size:8pt}
  .pr-hide,.pr-empty{display:none!important}
  .pv{display:block;white-space:pre-wrap;word-break:break-word;font-size:10.5pt;border-bottom:.5pt dotted var(--line);padding:1pt 0}
  td .pv{border:0}
  .pv-extra,.print-only{display:block;font:9pt/1.5 var(--f-mono);white-space:pre-wrap}
  .print-head{display:block;border-bottom:2pt solid #000;padding-bottom:6pt;margin-bottom:12pt}
  .print-head h1{font-size:18pt}
  .print-head div{font-size:10pt;margin-top:3pt}
  .tbl{overflow:visible;border:.5pt solid var(--line)}
  table{font-size:9pt}tr{break-inside:avoid}th{background:#eef2f3!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  td{padding:2pt 4pt}
  .chip{border:.5pt solid var(--line);background:#fff;padding:1pt 7pt;font-size:9pt}
  .chip input{display:none}
  .charts{grid-template-columns:repeat(2,1fr);break-inside:avoid}
  .bodybox{border:.5pt solid var(--line);background:#fff}
  .bodybox canvas{max-width:170pt}
  .posture-wrap{border:.5pt solid var(--line);background:#fff;break-inside:avoid}
  .posture-wrap canvas{max-height:320pt;width:auto!important;max-width:100%}
  .res{font-size:9pt}
  .flag{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head><body>
<script>window.__PWA=true</script>
<div class="app">
  <div class="print-head" id="print-head"></div>
  <header class="top">
    <div>
      <h1>Befund Studio</h1>
      <small>Physiotherapeutischer Befund nach Maitland-Konzept · Prototyp, nur mit Übungsdaten verwenden</small>
    </div>
    <div class="tools">
      <button class="btn" id="b-new" type="button">Neuer Befund</button>
      <button class="btn" id="b-lib" type="button">Gespeicherte Befunde</button>
      <button class="btn" id="b-backup" type="button">Sicherung</button>
      <button class="btn" id="b-export" type="button">Als TXT</button>
      <button class="btn pri" id="b-pdf" type="button">PDF speichern</button>
      <button class="btn" id="b-print" type="button">Drucken</button>
    </div>
  </header>
  <nav class="side" id="nav" aria-label="Bereiche"></nav>
  <main id="main"></main>
</div>
<div id="modal-root"></div>
<script src="jspdf.umd.min.js"></script>
<script>
/* ---------- Kern ---------- */
const KEY='befund-studio-v1';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fresh=()=>({f:{},mods:{ortho:true},bc:{front:[],back:[]},rest:false,pos:{}});
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
if(!S||!S.f)S=fresh();
S.bc=S.bc||{front:[],back:[]};S.pos=S.pos||{};S.mods=S.mods||{};
const LIB='befund-studio-lib-v1';
let LIGHT=false;const LV={'--surface2':'#eaeff0','--muted':'#5b6b72','--fg':'#18242a','--accent':'#0f6b73','--warn':'#b4531a'};
const cssv=n=>LIGHT?LV[n]:getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let _t;
function libGet(){try{return JSON.parse(localStorage.getItem(LIB)||'{}')||{}}catch(e){return {}}}
function libSync(){try{const lib=libGet();lib[S.id]={t:Date.now(),name:(S.f['b.pat']||'Ohne Namen').trim(),dat:S.f['b.datum']||'',s:S};localStorage.setItem(LIB,JSON.stringify(lib))}catch(e){}}
function saveNow(){clearTimeout(_t);if(!S.id&&S.f['b.pat'])S.id='b'+Date.now().toString(36);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(S.id)libSync()}
function save(){clearTimeout(_t);_t=setTimeout(saveNow,300)}
addEventListener('pagehide',()=>saveNow());
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});
const hooks=[];

/* Feld-Helfer: erzeugen HTML, Werte hängen an S.f[Schlüssel] */
const T=(k,l,t='text',ph='')=>`<div class="f"><label for="i-${k}">${l}</label><input id="i-${k}" type="${t}" data-k="${k}" placeholder="${esc(ph)}" autocomplete="off"></div>`;
const A=(k,l,ph='',rows=3)=>`<div class="f"><label for="i-${k}">${l}</label><textarea id="i-${k}" rows="${rows}" data-k="${k}" placeholder="${esc(ph)}"></textarea></div>`;
const SEL=(k,l,o)=>`<div class="f"><label for="i-${k}">${l}</label><select id="i-${k}" data-k="${k}"><option value=""></option>${o.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>`;
const CH=(k,l)=>`<label class="chip"><input type="checkbox" data-k="${k}">${l}</label>`;
const CHS=(title,cls,arr,pre)=>`<div class="chips ${cls||''}" data-title="${esc(title)}">${arr.map((x,i)=>CH(pre+i,x)).join('')}</div>`;
const SH=(t,extra='')=>`<div class="sub-h"><h3>${t}</h3>${extra}</div>`;
/* Zelle in Tabellenzeile */
const TI=(k,t='text',ph='')=>`<td><input type="${t}" data-k="${k}" aria-label="${esc(k)}" placeholder="${esc(ph)}"></td>`;
const TS=(k,o)=>`<td><select data-k="${k}" aria-label="${esc(k)}"><option value=""></option>${o.map(x=>`<option>${esc(x)}</option>`).join('')}</select></td>`;
const TBL=(heads,rows)=>`<div class="tbl"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;

function bind(root=document){
  $$('[data-k]',root).forEach(el=>{
    const v=S.f[el.dataset.k];
    if(el.type==='checkbox')el.checked=!!v;else if(v!=null)el.value=v;
  });
}
document.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset||!el.dataset.k)return;
  S.f[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;
  save();hooks.forEach(h=>h(el.dataset.k));
});

function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;t.setAttribute('role','status');
  document.body.appendChild(t);setTimeout(()=>t.remove(),2200);
}

/* ---------- Bereiche registrieren ---------- */
const SECS=[];
const reg=(id,name,fixed,sub,html,init)=>SECS.push({id,name,fixed,sub,html,init});

/* ---------- Dialog ---------- */
function modal(title,body,buttons,onclose){
  const root=$('#modal-root');
  root.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div><h2>${title}</h2>${body}<div class="tools" id="m-btns"></div></div></div>`;
  const box=$('#m-btns');
  const close=()=>{root.innerHTML='';onclose&&onclose()};
  buttons.concat([{l:'Schließen',f:()=>{}}]).forEach(b=>{
    const el=document.createElement('button');el.type='button';el.className='btn'+(b.pri?' pri':'');el.textContent=b.l;
    el.onclick=async()=>{const keep=await b.f();if(keep!==true)close()};box.appendChild(el);
  });
  const bg=$('.modal',root);bg.addEventListener('mousedown',e=>{if(e.target===bg)close()});
}
function copyText(txt,ta){
  const fb=()=>{ta.focus();ta.select();toast('Text markiert, mit Strg+C kopieren')};
  try{navigator.clipboard.writeText(txt).then(()=>toast('Kopiert'),fb)}catch(e){fb()}
}

/* ---------- Text-Export: liest sichtbare Bereiche generisch aus ---------- */
function val(el){
  if(el.type==='checkbox')return el.checked?'ja':'';
  return (el.value||'').trim();
}
function dumpSection(sec){
  let out=[];
  const walk=(root)=>{
    [...root.children].forEach(ch=>{
      if(ch.hidden)return;
      if(ch.matches('.f')){const el=$('[data-k]',ch);if(el&&val(el))out.push(`${$('label',ch).textContent}: ${val(el)}`)}
      else if(ch.matches('.chips[data-title]')){const on=$$('.chip',ch).filter(c=>$('input',c).checked).map(c=>c.textContent.trim());if(on.length)out.push(`${ch.dataset.title}: ${on.join(', ')}`)}
      else if(ch.matches('.tbl')){
        const heads=$$('th',ch).map(h=>h.textContent.trim());
        $$('tbody tr',ch).forEach(tr=>{
          if(tr.hidden)return;
          if(!$$('[data-k]',tr).some(el=>val(el)))return;
          const cells=[...tr.children].map((td,i)=>{const el=$('[data-k]',td);const v=el?val(el):td.textContent.trim();return v?(i?`${heads[i]} ${v}`:v):''});
          if(cells.slice(1).some(Boolean))out.push('  • '+cells.filter(Boolean).join(' · '));
        });
      }
      else if(ch.matches('.sub-h')){out.push('\n'+$('h3',ch).textContent.trim().toUpperCase())}
      else if(ch.matches('.res')){if(ch.id!=='po-res')$$('div',ch).forEach(d=>{const sp=$('span',d),b=$('b',d);if(sp&&b&&b.textContent.trim()!=='–')out.push('  '+sp.textContent+': '+b.textContent)})}
      else if(ch.children.length)walk(ch);
    });
  };
  walk($('.body',sec));
  return out.filter((l,i)=>!(l.startsWith('\n')&&(i+1>=out.length||out[i+1].startsWith('\n'))));
}
function buildText(){
  const L=['BEFUND · '+new Date().toLocaleDateString('de-AT'),''];
  SECS.forEach(s=>{
    const el=$('#sec-'+s.id);if(!el||el.hidden)return;
    const lines=dumpSection(el);
    if(s.extra)lines.push(...s.extra());
    if(lines.length){L.push('=== '+s.name.toUpperCase()+' ===',...lines,'')}
  });
  return L.join('\n');
}

/* ---------- Datei speichern (TXT, PDF) ---------- */
const fname=(pre,ext)=>{const n=(S.f['b.pat']||'').trim().replace(/[^\wäöüÄÖÜß-]+/g,'_').replace(/^_+|_+$/g,'');return pre+(n?'_'+n:'')+'_'+(S.f['b.datum']||new Date().toISOString().slice(0,10))+'.'+ext};
async function saveFile(name,data){
  try{
    const dl=(window.claude&&claude.use)?await claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data});toast('Datei gespeichert');return true}
  }catch(e){if(e&&e.code==='declined')return false}
  const type=name.endsWith('.pdf')?'application/pdf':'text/plain;charset=utf-8';
  const blob=data instanceof Blob?data:new Blob([data],{type});
  try{
    const file=new File([blob],name,{type:blob.type});
    if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:name});return true}catch(e){if(e&&e.name==='AbortError')return false}
    }
  }catch(e){}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);toast('Datei wird gespeichert');return true;
}
/* ---------- Basisdaten (immer) ---------- */
reg('basis','Basisdaten',true,'immer enthalten',`

const BC_TYPES=[['Schmerz','#d64545'],['Kribbeln','#3b7dd8'],['Taubheit','#2b9a5f'],['Brennen','#e08a1e'],['Sonstiges','#8a5bc7']];
let bcType=0,bcDown=null;
function drawBody(cv,side){
  const c=cv.getContext('2d');
  const fill=cssv('--surface2').trim()||'#eee',ln=cssv('--muted').trim()||'#666',fg=cssv('--fg').trim()||'#000';
  c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);c.setTransform(2,0,0,2,0,0);
  c.lineJoin='round';c.lineCap='round';c.setLineDash([]);
  const both=fn=>{fn();c.save();c.translate(300,0);c.scale(-1,1);fn();c.restore()};
  const body=d=>{const p=new Path2D(d);c.fillStyle=fill;c.strokeStyle=ln;c.lineWidth=1.6;c.fill(p);c.stroke(p)};
  const det=(d,a)=>{c.save();c.globalAlpha=a||.6;c.strokeStyle=ln;c.lineWidth=1.1;c.stroke(new Path2D(d));c.restore()};
  const finger=(x1,y1,x2,y2)=>{c.lineWidth=9;c.strokeStyle=ln;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.lineWidth=6;c.strokeStyle=fill;c.stroke()};
  const front=side==='front';
  /* Beine */
  both(()=>{
    body('M152 322 C156 360 156 400 160 440 C160 452 160 462 162 470 C164 500 166 530 168 560 L170 584 L185 584 L188 562 C192 540 194 510 192 480 C190 470 190 460 192 448 C200 410 210 360 204 308');
    body(front?'M169 582 L186 582 C190 594 196 604 198 614 C198 624 190 628 178 628 C168 628 164 622 164 612 C164 600 167 592 169 582':'M169 582 L186 582 C189 594 191 606 189 617 C186 627 171 627 167 617 C165 606 166 594 169 582');
    if(front){[[169,624,5],[176,627,4.2],[182,627,4],[188,625,3.6],[194,621,3.2]].forEach(t=>{c.beginPath();c.ellipse(t[0],t[1],t[2],t[2]*.9,0,0,7);c.fillStyle=fill;c.fill();c.strokeStyle=ln;c.lineWidth=1.2;c.stroke()})}
  });
  /* Rumpf */
  both(()=>body('M150 90 L162 88 C170 96 188 100 204 104 L208 114 L200 150 C198 190 196 215 192 240 C190 262 198 284 204 308 L150 322'));
  /* Arme und Hände */
  both(()=>{
    body('M204 104 C216 106 224 118 224 134 C227 170 231 190 229 208 C233 240 241 266 247 288 L232 286 C224 262 218 240 214 216 C210 190 206 170 200 150');
    body('M232 285 L247 289 C253 299 255 308 253 316 L234 315 C232 304 232 294 232 285');
    finger(236,314,236,335);finger(241,315,242,347);finger(246,316,248,353);finger(251,314,254,346);finger(253,299,265,323);
  });
  /* Hals und Kopf */
  both(()=>body('M150 70 L138 70 L137 92 L150 92'));
  body('M126 46 C126 24 138 14 150 14 C162 14 174 24 174 46 C174 64 164 78 150 78 C136 78 126 64 126 46');
  both(()=>{body('M126 44 C120 42 119 54 126 58')});
  c.fillStyle=fill;
  if(front){c.fillStyle=ln;[[142,44],[158,44]].forEach(e=>{c.beginPath();c.arc(e[0],e[1],1.6,0,7);c.fill()});det('M150 46 L148 56 L152 56');det('M143 66 C148 68 152 68 157 66')}
  
  /* Details */
  if(front){
    both(()=>{det('M152 100 C170 100 188 104 202 108');det('M156 150 C172 160 190 156 198 146');det('M152 200 C170 204 184 200 192 194',.35);ell(176,462,9,12)});
    c.beginPath();c.ellipse(150,238,2.2,3,0,0,7);c.stroke();det('M150 108 L150 200',.35);
  }else{
    both(()=>{det('M158 118 L197 112 M158 118 C157 134 158 150 163 162 C175 158 185 150 190 140 C192 128 195 120 197 112');det('M152 322 C170 332 198 328 204 308');det('M164 468 C170 472 182 472 190 468');det('M174 560 L176 584')});
    c.save();c.setLineDash([4,4]);det('M150 92 L150 300',.7);c.restore();det('M150 300 L150 322');
  }
  function ell(x,y,rx,ry){c.save();c.globalAlpha=.55;c.strokeStyle=ln;c.lineWidth=1.1;c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.stroke();c.restore()}
  c.fillStyle=fg;c.font='600 13px sans-serif';c.textAlign='center';
  const rl=front?['R','L']:['L','R'];c.fillText(rl[0],24,20);c.fillText(rl[1],276,20);
  S.bc[side].forEach(s=>{
    c.strokeStyle=BC_TYPES[s.t][1];c.globalAlpha=.5;c.lineWidth=14;c.lineCap='round';c.lineJoin='round';c.beginPath();
    s.p.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));if(s.p.length===1)c.lineTo(s.p[0][0]+.1,s.p[0][1]);c.stroke();c.globalAlpha=1;
  });
  const seen={};
  S.bc[side].forEach(s=>{if(seen[s.n])return;seen[s.n]=1;const [x,y]=s.p[0];
    c.fillStyle='#18242a';c.beginPath();c.arc(x+12,y-12,9,0,7);c.fill();c.fillStyle='#fff';c.font='600 11px sans-serif';c.fillText(s.n,x+12,y-8)});
}
function bcRedraw(){$$('canvas[data-bc]').forEach(cv=>drawBody(cv,cv.dataset.bc))}
function bcInit(){
  $$('canvas[data-bc]').forEach(cv=>{
    const side=cv.dataset.bc;
    const pt=e=>{const r=cv.getBoundingClientRect();return [Math.round((e.clientX-r.left)*300/r.width),Math.round((e.clientY-r.top)*630/r.height)]};
    cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);S.rest=false;const st={t:bcType,n:S.bcn||1,p:[pt(e)],_o:(S._o=(S._o||0)+1)};S.bc[side].push(st);bcDown=st;bcRedraw()});
    cv.addEventListener('pointermove',e=>{if(bcDown&&S.bc[side].includes(bcDown)){bcDown.p.push(pt(e));bcRedraw()}});
    const up=()=>{if(bcDown){bcDown=null;save()}};
    cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  });
  const area=()=>{$('#bc-area').textContent=S.bcn||1};
  $('#bc-types').innerHTML=BC_TYPES.map((t,i)=>`<button type="button" class="btn sm${i===bcType?' on':''}" data-t="${i}"><span class="sw" style="background:${t[1]}"></span> ${t[0]}</button>`).join('');
  $('#bc-types').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;bcType=+b.dataset.t;$$('#bc-types .btn').forEach(x=>x.classList.toggle('on',x===b))};
  $('#bc-next').onclick=()=>{S.bcn=Math.min((S.bcn||1)+1,9);area();save()};
  $('#bc-undo').onclick=()=>{
    let best=null;['front','back'].forEach(s=>S.bc[s].forEach(x=>{if(!best||(x._o||0)>=(best.x._o||0))best={s,x}}));
    if(best){S.bc[best.s].splice(S.bc[best.s].indexOf(best.x),1);bcRedraw();save()}};
  $('#bc-clear').onclick=()=>{S.bc={front:[],back:[]};S.bcn=1;area();bcRedraw();save()};
  area();bcRedraw();
}

const PW=640;let pView='side',pAct=0,pDrag=-1;const pImgs={};
const pst=v=>(S.pos[v]=S.pos[v]||{pts:{},cm:''});
const pAng=(a,b)=>Math.atan2(Math.abs(b[1]-a[1]),Math.abs(b[0]-a[0]))*180/Math.PI;
function pAbs(v){const o={};Object.entries(pst(v).pts).forEach(([i,p])=>o[i]=[p[0]*PW,p[1]*PW]);return o}
function pScale(v,P){const n=PV[v].pts.length,a=P[n],b=P[n+1],cm=parseFloat(pst(v).cm);
  if(a&&b&&cm>0){const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(d>5)return cm/d}return null}
function pMetrics(v){
  const P=pAbs(v),sc=pScale(v,P),u=sc?' cm':' px',f=x=>(x*(sc||1)).toFixed(1)+u,out=[];
  if(v==='side'){
    if(P[0]&&P[1])out.push(['Kraniovertebraler Winkel (CVA)',pAng(P[1],P[0]).toFixed(1)+'°']);
    const lot=P[5]?P[5][0]:null,dir=S.f['po.face']==='links'?-1:1;
    if(lot!=null)[[0,'Tragus'],[2,'Akromion'],[3,'Trochanter major'],[4,'Knie']].forEach(([i,n])=>{if(P[i]){const d=(P[i][0]-lot)*dir;out.push([n+' zum Lot',f(Math.abs(d))+(Math.abs(d)<1?'':d>0?' ventral':' dorsal')])}});

    [['Ohrlinie',0,1],['Schulterlinie',2,3],['Beckenlinie',4,5],['Kniegelenkslinie',6,7],['Malleolenlinie',8,9]].forEach(([n,a,b])=>{

let poseP=null,poseRes=null;

  if(poseP)return poseP;

    const s=document.createElement('script');s.src='mediapipe/pose/pose.js';
    s.onerror=()=>{poseP=null;rej(new Error('nofiles'))};
    s.onload=async()=>{try{
      const pose=new Pose({locateFile:f=>'mediapipe/pose/'+f});
      pose.setOptions({modelComplexity:1,smoothLandmarks:false,enableSegmentation:false,minDetectionConfidence:.4});
      pose.onResults(r=>{if(poseRes)poseRes(r)});
      await pose.initialize();res(pose)
    }catch(e){poseP=null;rej(e)}};
    document.head.appendChild(s);
  });
  return poseP;
}

      const sm=mid(11,12),hm=mid(23,24);st[11]=[sm[0],sm[1]+.15*(hm[1]-sm[1])];
      set.push(10,11);
    }
    save();haltungSec.api.next0();
    haltungSec.api.redraw();
    toast(low>2?'Erkennung unsicher: Punkte bitte genau prüfen':(pView==='side'?'Punkte gesetzt. C7 bitte von Hand setzen.':'Punkte gesetzt. Bitte prüfen und bei Bedarf ziehen.'));
  }catch(e){
    poseRes=null;
    toast(e&&e.message==='nofiles'?'Analyse-Modell nicht gefunden (Ordner mediapipe fehlt)':'Analyse fehlgeschlagen: '+(e&&e.message||e));
  }finally{btn.disabled=false;btn.textContent=old}
}

/* ---------- PDF-Erzeugung (jsPDF) ---------- */
const pdfSan=s=>String(s).replace(/[–—‑]/g,'-').replace(/[„“”«»]/g,'"').replace(/[‘’]/g,"'").replace(/•/g,'-').replace(/₂/g,'2').replace(/≥/g,'>=').replace(/≤/g,'<=').replace(/→/g,'->').replace(/✓/g,'ja').replace(/[^\u0009\u000a -ÿ]/g,'?');
async function buildPdf(){
  if(!(window.jspdf&&window.jspdf.jsPDF))throw new Error('PDF-Bibliothek nicht geladen');
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});
  const M=15,PWm=210,CW=PWm-2*M,PH=297,BOT=PH-18;
  let y=M;
  const need=h=>{if(y+h>BOT){doc.addPage();y=M}};
  const F=S.f,T=(t,s,st)=>{doc.setFont('helvetica',st||'normal');doc.setFontSize(s)};
  /* Kopf */
  T('',20,'bold');doc.setTextColor(15,107,115);doc.text('Physiotherapeutischer Befund',M,y+6);y+=11;
  doc.setTextColor(0);T('',11,'bold');
  const fd=d=>d?new Date(d).toLocaleDateString('de-AT'):'';
  doc.text(pdfSan(F['b.pat']||'Ohne Namen'),M,y);
  T('',10,'normal');
  const sub=[F['b.geb']?'geb. '+fd(F['b.geb']):'',F['b.datum']?'Befund vom '+fd(F['b.datum']):'',F['b.thera']?'Therapeut/in: '+F['b.thera']:''].filter(Boolean).join('  |  ');
  if(sub){y+=5;doc.text(pdfSan(sub),M,y)}
  y+=4;doc.setDrawColor(15,107,115);doc.setLineWidth(.6);doc.line(M,y,PWm-M,y);y+=6;
  /* Abschnitte */
  const imgsBC=()=>{
    if(!(S.bc.front.length+S.bc.back.length))return;
    LIGHT=true;bcRedraw();
    const urls=$$('canvas[data-bc]').map(c=>{const t=document.createElement('canvas');t.width=c.width;t.height=c.height;const x=t.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,t.width,t.height);x.drawImage(c,0,0);return t.toDataURL('image/jpeg',.9)});
    LIGHT=false;bcRedraw();
    const w=52,h=w*1260/600;need(h+20);y+=2;
    T('',10,'bold');doc.setTextColor(15,107,115);doc.text('BODYCHART',M,y);doc.setTextColor(0);y+=3;
    doc.addImage(urls[0],'JPEG',M,y,w,h);doc.addImage(urls[1],'JPEG',M+w+6,y,w,h);
    T('',8.5,'normal');doc.setTextColor(70);
    doc.text(doc.splitTextToSize('Farben: rot = Schmerz, blau = Kribbeln, grün = Taubheit, orange = Brennen, violett = Sonstiges. Nummern verweisen auf die Tabelle der Symptombereiche.',CW-2*w-18),M+2*w+14,y+6);
    doc.setTextColor(0);y+=h+5;
  };
  const imgsPosture=()=>{
    const hs=haltungSec;if(!hs.api)return;
    const items=[];
    LIGHT=true;
    Object.keys(PV).forEach(v=>{
      if(!pImgs[v]||!Object.keys(pst(v).pts).length)return;
      const c=document.createElement('canvas');hs.api.render(v,c);
      items.push({v,url:c.toDataURL('image/jpeg',.85),r:c.height/c.width});
    });
    LIGHT=false;
    if(!items.length)return;
    const w=Math.min(80,(CW-8)/items.length),h=Math.max(...items.map(i=>w*i.r));
    need(h+14);y+=4;T('',10,'bold');doc.setTextColor(15,107,115);doc.text('HALTUNGSFOTOS',M,y);doc.setTextColor(0);y+=3;
    items.forEach((it,i)=>{doc.addImage(it.url,'JPEG',M+i*(w+4),y,w,w*it.r);T('',8,'normal');doc.text(pdfSan(PV[it.v].n),M+i*(w+4),y+w*it.r+3.5)});
    y+=h+8;
  };
  const SECS_OUT=[];
  SECS.forEach(s=>{const el=$('#sec-'+s.id);if(!el||el.hidden)return;
    let lines=dumpSection(el);if(s.extra)lines=lines.concat(s.extra());
    lines=lines.filter(l=>!/^Bodychart: \d+ Striche/.test(l));
    const hasImg=(s.id==='anamnese'&&S.bc.front.length+S.bc.back.length>0)||(s.id==='haltung'&&Object.keys(PV).some(v=>pImgs[v]&&Object.keys(pst(v).pts).length));
    if(!lines.length&&!hasImg)return;
    SECS_OUT.push({s,lines});
  });
  SECS_OUT.forEach(({s,lines})=>{
    need(20);
    doc.setFillColor(217,238,238);doc.rect(M,y-4.5,CW,7,'F');
    T('',12,'bold');doc.setTextColor(15,107,115);doc.text(pdfSan(s.name),M+2,y);doc.setTextColor(0);y+=7;
    lines.forEach(raw=>{
      const sh=raw.startsWith('\n'),line=pdfSan(raw.replace(/^\n/,''));
      if(sh){need(12);y+=2;T('',9.5,'bold');doc.text(line,M,y);doc.setDrawColor(190);doc.setLineWidth(.2);doc.line(M,y+1.2,PWm-M,y+1.2);y+=5.5;return}
      if(/^\s+- /.test(line)||/^\s+•/.test(line)||raw.startsWith('  ')){
        const t=line.replace(/^\s+/,'');T('',9,'normal');const ls=doc.splitTextToSize(t,CW-6);
        need(ls.length*4+1);ls.forEach((l,i)=>{doc.text(l,M+4,y);y+=4});y+=.5;return}
      const k=line.indexOf(': ');
      if(k<0){T('',9.5,'normal');const ls=doc.splitTextToSize(line,CW);need(ls.length*4.6);ls.forEach(l=>{doc.text(l,M,y);y+=4.6});return}
      const lab=line.slice(0,k+1),val=line.slice(k+2);
      T('',9,'bold');const lw=doc.getTextWidth(lab+' ');
      if(lw<48&&val.length<90&&!val.includes('\n')){
        need(5);doc.text(lab,M,y);T('',9.5,'normal');const ls=doc.splitTextToSize(val,CW-lw);
        need(ls.length*4.6);ls.forEach((l,i)=>{doc.text(l,M+lw,y);y+=4.6});y+=.8;
      }else{
        T('',9.5,'normal');const ls=doc.splitTextToSize(val,CW-4);need(4+ls.length*4.6);
        T('',8.5,'bold');doc.setTextColor(70);doc.text(lab,M,y);doc.setTextColor(0);y+=4.2;
        T('',9.5,'normal');ls.forEach(l=>{doc.text(l,M+3,y);y+=4.6});y+=1.2;
      }
    });
    if(s.id==='anamnese')imgsBC();
    if(s.id==='haltung')imgsPosture();
    y+=4;
  });
  /* Fuß */
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);T('',8,'normal');doc.setTextColor(110);doc.text('Befund Studio  |  '+pdfSan(F['b.pat']||''),M,PH-8);doc.text('Seite '+i+' von '+n,PWm-M,PH-8,{align:'right'});doc.setTextColor(0)}
  return doc.output('blob');
}

/* ---------- Drucken / PDF ---------- */
let printing=false;
function pval(el){
  if(el.tagName==='SELECT')return el.value?el.options[el.selectedIndex].text:'';
  const v=(el.value||'').trim();
  if(el.type==='date'&&v){const d=new Date(v);return isNaN(d)?v:d.toLocaleDateString('de-AT')}
  return v;
}
function printClean(){
  if(!printing)return;printing=false;
  $$('.pv,.pv-extra').forEach(x=>x.remove());
  $$('.pr-hide').forEach(x=>x.classList.remove('pr-hide'));
  $$('.pr-empty').forEach(x=>x.classList.remove('pr-empty'));
  LIGHT=false;bcRedraw();const h=SECS.find(x=>x.id==='haltung');h&&h.redraw&&h.redraw();
}
function printPrep(){
  printClean();printing=true;LIGHT=true;
  bcRedraw();const hs=SECS.find(x=>x.id==='haltung');hs&&hs.redraw&&hs.redraw();
  const F=S.f;
  $('#print-head').innerHTML=`<h1>Physiotherapeutischer Befund</h1><div><b>${esc(F['b.pat']||'')}</b>${F['b.geb']?' · geb. '+new Date(F['b.geb']).toLocaleDateString('de-AT'):''}${F['b.datum']?' · Befund vom '+new Date(F['b.datum']).toLocaleDateString('de-AT'):''}</div>${F['b.thera']?`<div>Therapeut/in: ${esc(F['b.thera'])}</div>`:''}`;
  const empty=el=>el.classList.add('pr-empty');
  $$('main [data-k]').forEach(el=>{
    if(el.type==='checkbox'||el.closest('[hidden]'))return;
    const v=pval(el),d=document.createElement('div');d.className='pv';d.textContent=v;el.after(d);el.classList.add('pr-hide');
    const f=el.closest('.f');if(f&&!v)empty(f);
  });
  $$('main .chip').forEach(c=>{if(!$('input',c).checked)empty(c)});
  $$('main .chips').forEach(c=>{if(!$$('.chip',c).some(x=>!x.classList.contains('pr-empty')))empty(c)});
  $$('main .tbl').forEach(t=>{
    let n=0;$$('tbody tr',t).forEach(tr=>{if(tr.hidden)return;if($$('[data-k]',tr).some(el=>pval(el)))n++;else empty(tr)});
    if(!n)empty(t);
  });
  $$('main .res').forEach(r=>{if(r.id==='po-res'||!$$('b',r).some(b=>b.textContent.trim()!=='–'))empty(r)});
  const nbc=S.bc.front.length+S.bc.back.length;
  if(!nbc){$$('main .charts').forEach(empty);empty($('#bc-leg'))}
  $$('main .posture-wrap').forEach(w=>{if(!pImgs[pView])empty(w)});
  const hb=$('#sec-haltung .body');
  if(hb){const lines=[];Object.keys(PV).forEach(v=>{const m=pMetrics(v);if(m.length){lines.push(PV[v].n);m.forEach(x=>lines.push('  '+x[0]+': '+x[1]))}});
    if(lines.length){const x=document.createElement('div');x.className='pv-extra';x.textContent=lines.join('\n');hb.appendChild(x)}}
  /* Container und Überschriften ohne Inhalt ausblenden */
  const LEAF='.f,.chips,.tbl,.res,.charts,.posture-wrap,.pv-extra,.print-only';
  const has=el=>{
    if(el.hidden||el.classList.contains('pr-empty'))return false;
    if(el.matches(LEAF))return true;
    if(el.matches('.sub-h,.hint,.banner,.legend,.tools,.lbl'))return false;
    const kids=[...el.children];const r=kids.some(has);if(!r&&kids.length)empty(el);return r;
  };
  $$('main section.card').forEach(sec=>{
    if(sec.hidden)return;
    const kids=[...$('.body',sec).children];let any=false;
    kids.forEach(k=>{if(has(k))any=true});
    kids.forEach((k,i)=>{
      if(k.matches('.sub-h')||k.matches('.lbl')){
        let j=i+1,ok=false;while(j<kids.length&&!kids[j].matches('.sub-h')){if(has(kids[j])){ok=true;break}j++}
        if(!ok)empty(k);
      }
    });
    if(!any)empty(sec);
  });
}
